<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Coupon Ticket Outer Shape with Notches -->
  <g filter="url(#glow)">
    <path d="M 12 18 
             C 12 15 15 12 18 12 
             L 46 12 
             C 49 12 52 15 52 18 
             L 52 28 
             A 4 4 0 0 0 52 36 
             L 52 46 
             C 52 49 49 52 46 52 
             L 18 52 
             C 15 52 12 49 12 46 
             L 12 36 
             A 4 4 0 0 0 12 28 
             Z" 
          fill="url(#goldGrad)" />
  </g>

  <!-- Dashed perforation line -->
  <line x1="24" y1="14" x2="24" y2="50" stroke="#78350f" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Star emblem on left stub -->
  <path d="M 18 28 L 19 31 L 22 32 L 19 33 L 18 36 L 17 33 L 14 32 L 17 31 Z" fill="#78350f" opacity="0.8" />

  <!-- Bold 'M' emblem for mobbakun on ticket body -->
  <path d="M 30 44 L 30 20 L 35 32 L 40 20 L 40 44 L 37 44 L 37 27 L 35 33 L 34.5 33 L 32.5 27 L 32.5 44 Z" fill="#0f172a" font-weight="900" />

  <!-- Small top right shine star -->
  <path d="M 45 16 L 46 18 L 48 19 L 46 20 L 45 22 L 44 20 L 42 19 L 44 18 Z" fill="#ffffff" opacity="0.9" />
</svg>
